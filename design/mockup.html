<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vision 2030 Dashboard Mockup</title>
<style>
:root{
  --bg:#ECEDEB; --card:#FFFFFF; --ink:#16201B; --ink2:#5B6660; --muted:#98A19C;
  --line:#E6E8E6; --g900:#0B5F39; --g700:#0E7C4A; --g500:#3E9C6E; --g300:#A9D4BC; --g100:#E3F1E8;
  --gold:#B5832A; --red:#B42318; --pill:#F3F4F2;
}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1280px;height:720px;background:var(--bg);font-family:Inter,"Segoe UI",sans-serif;color:var(--ink);overflow:hidden}
.page{position:relative;width:1280px;height:720px;padding:14px 18px}
.top{height:52px;background:var(--card);border-radius:26px;display:flex;align-items:center;padding:0 10px 0 16px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;color:var(--g700);width:240px}
.logo i{width:26px;height:26px;border-radius:50%;background:var(--g700);display:inline-block;position:relative}
.logo i:after{content:"";position:absolute;inset:7px;border-radius:50%;background:#fff}
.logo i:before{content:"";position:absolute;width:8px;height:8px;right:-1px;bottom:-1px;background:var(--g700);border-radius:2px}
.nav{margin:0 auto;background:var(--pill);border-radius:20px;padding:4px;display:flex;gap:2px}
.nav span{font-size:12px;color:var(--ink2);padding:8px 14px;border-radius:16px}
.nav span.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.tr{display:flex;gap:8px;align-items:center;width:240px;justify-content:flex-end}
.circ{width:34px;height:34px;border-radius:50%;background:var(--pill);display:grid;place-items:center}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--g700);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.head{display:flex;align-items:center;margin:18px 0 14px 70px}
.head h1{font-size:28px;font-weight:600;letter-spacing:-.5px}
.head h1 span{color:var(--muted);font-weight:400}
.head .r{margin-left:auto;display:flex;gap:8px}
.chip{background:#fff;border-radius:18px;padding:9px 14px;font-size:12px;font-weight:500;display:flex;gap:8px;align-items:center}
.side{position:absolute;left:18px;top:136px;display:flex;flex-direction:column;gap:10px}
.side .grp{background:#fff;border-radius:22px;padding:6px;display:flex;flex-direction:column;gap:6px}
.side .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.side .ic.on{background:var(--g700)}
.grid{position:absolute;left:70px;right:18px;top:136px;bottom:14px;display:grid;gap:12px}
.card{background:var(--card);border-radius:20px;padding:14px 16px;position:relative;overflow:hidden}
.ct{font-size:13px;font-weight:600}
.cs{font-size:10.5px;color:var(--muted);margin-top:2px}
.arrow{position:absolute;right:12px;top:12px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center}
.big{font-size:30px;font-weight:600;letter-spacing:-.8px}
.big small{font-size:18px;color:var(--muted);font-weight:500}
.tag{display:inline-block;font-size:10px;font-weight:600;padding:3px 8px;border-radius:10px;background:var(--g100);color:var(--g700)}
.tag.bad{background:#FBE9E7;color:var(--red)}
.hero{background:linear-gradient(135deg,#0E7C4A 0%,#0B5F39 100%);color:#fff;border-radius:16px;padding:14px 16px;margin-top:12px;height:118px;position:relative}
.hero .k{font-size:10.5px;opacity:.8}
.hero .v{font-size:32px;font-weight:600;letter-spacing:-.8px;margin-top:6px}
.hero .f{position:absolute;bottom:12px;left:16px;right:16px;display:flex;justify-content:space-between;font-size:10.5px;opacity:.9}
.hero b{font-weight:700;font-size:13px;letter-spacing:.5px}
.seg{position:absolute;right:52px;top:12px;background:var(--pill);border-radius:16px;padding:3px;display:flex}
.seg span{font-size:10.5px;padding:6px 12px;border-radius:13px;color:var(--ink2)}
.seg span.on{background:var(--g700);color:#fff}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:11px}
th{font-weight:500;color:var(--muted);text-align:left;padding:6px 6px;font-size:10.5px}
td{padding:8px 6px;border-top:1px solid var(--line)}
tr.alt td{background:#F7F8F7}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:middle}
.leg{display:flex;gap:14px;font-size:10.5px;color:var(--ink2);margin-top:6px}
.leg i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.bar{height:8px;border-radius:4px;background:var(--g100);position:relative;margin-top:6px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--g700)}
.plot{position:absolute;left:10px;right:12px;bottom:8px}
.note{font-size:11px;color:var(--ink2);line-height:1.5}
svg text{font-family:Inter,"Segoe UI",sans-serif}
/* background-only mode: hide data, keep shells & static titles */
body.bg [data-d]{visibility:hidden}
body.bg .hero{background:linear-gradient(135deg,#0E7C4A 0%,#0B5F39 100%)}
.page{display:none}.page.show{display:block}
</style>
</head>
<body>
<script>
const P = new URLSearchParams(location.search);
if (P.get('bg')==='1') document.body.classList.add('bg');
const PAGE = +(P.get('p')||1);

/* ---------------- data (same values as sql/02_insert_data.sql) ---------------- */
const Q = (a,b)=>{const o=[];let [y,q]=[+a.slice(0,4),+a[5]];while(true){o.push(`${y}Q${q}`);if(`${y}Q${q}`===b)break;q++;if(q>4){q=1;y++}}return o};
const urQ = Q('2017Q1','2026Q2');
const urSA=[12.7,12.8,12.8,12.8,12.9,12.9,12.8,12.7,12.5,12.3,12.0,12.0,11.8,15.4,14.9,12.6,11.7,11.3,11.3,11.0,10.1,9.7,9.9,8.0,8.7,8.5,8.8,7.8,7.6,7.1,7.8,7.0,6.3,6.8,7.5,7.2,6.4,6.5];
const lfQ = Q('2021Q1','2026Q2');
const lfF=[31.9,32.1,34.3,34.7,33.3,35.1,36.5,35.5,35.5,34.8,35.4,35.0,35.8,35.4,36.2,36.0,36.3,34.5,33.7,34.5,33.9,33.7];
const lfM=[64.8,65.0,65.1,65.6,65.1,66.5,66.3,67.3,67.1,66.3,65.7,65.4,66.4,66.3,66.9,66.2,66.4,64.0,64.3,64.7,64.2,63.9];
const fuQ = Q('2023Q4','2026Q2');
const urF=[13.9,14.2,12.8,13.6,11.9,10.5,11.3,12.1,10.3,9.0,9.6];
const eprQ=['2024Q1','2024Q2','2024Q3','2024Q4','2025Q1','2025Q2','2025Q3','2025Q4','2026Q1'];
const eprF=[30.7,30.8,31.3,31.8,32.5,null,29.7,31.0,30.8];
const gQ = Q('2025Q1','2026Q3');
const gNon=[4.9,4.6,4.3,4.1,2.9,0.8,1.9], gOil=[-0.5,3.8,8.3,10.4,2.9,-24.7,-20.4], gTot=[3.4,3.9,4.8,4.9,3.0,-4.7,-3.8];
const lbl = k=>`Q${k[5]} ${k.slice(2,4)}`;

/* ---------------- tiny SVG chart helpers ---------------- */
const NS='http://www.w3.org/2000/svg';
function svg(w,h){const s=document.createElementNS(NS,'svg');s.setAttribute('width',w);s.setAttribute('height',h);s.setAttribute('viewBox',`0 0 ${w} ${h}`);return s}
function el(p,t,a,txt){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;p.appendChild(e);return e}
function axisY(s,x0,x1,y,ticks,fmt){ticks.forEach(t=>{el(s,'line',{x1:x0,x2:x1,y1:y(t),y2:y(t),stroke:'#E6E8E6','stroke-dasharray':t===0?'':'3 4'});el(s,'text',{x:x0-6,y:y(t)+3,'text-anchor':'end','font-size':9.5,fill:'#98A19C'},fmt?fmt(t):t)})}
function roundTopBar(s,x,y0,y1,w,r,fill){ // rounded on the far end, flat on baseline
  const up=y1<y0, h=Math.abs(y1-y0), rr=Math.min(r,h,w/2);
  const d= up?`M${x},${y0} V${y1+rr} Q${x},${y1} ${x+rr},${y1} H${x+w-rr} Q${x+w},${y1} ${x+w},${y1+rr} V${y0} Z`
             :`M${x},${y0} V${y1-rr} Q${x},${y1} ${x+rr},${y1} H${x+w-rr} Q${x+w},${y1} ${x+w},${y1-rr} V${y0} Z`;
  return el(s,'path',{d,fill})}

function barChart(host,w,h,cats,vals,opt={}){
  const s=svg(w,h), m={l:30,r:8,t:26,b:22};
  const lo=Math.min(0,...vals), hi=Math.max(...vals)*1.15;
  const y=v=>m.t+(hi-v)/(hi-lo)*(h-m.t-m.b);
  axisY(s,m.l,w-m.r,y,opt.ticks||[0,1,2,3,4,5],v=>v+'%');
  const bw=(w-m.l-m.r)/cats.length, barW=Math.min(34,bw*.62);
  vals.forEach((v,i)=>{const x=m.l+i*bw+(bw-barW)/2, last=i===vals.length-1;
    roundTopBar(s,x,y(0),y(v),barW,10,last?'#0E7C4A':'#A9D4BC');
    el(s,'text',{x:x+barW/2,y:h-6,'text-anchor':'middle','font-size':9.5,fill:'#98A19C'},lbl(cats[i]));
    if(last){const tx=x+barW/2, ty=y(v)-12;
      el(s,'rect',{x:tx-22,y:ty-11,width:44,height:17,rx:8.5,fill:'#0E7C4A'});
      el(s,'text',{x:tx,y:ty+1,'text-anchor':'middle','font-size':9.5,'font-weight':600,fill:'#fff'},'+'+v.toFixed(1)+'%');
      el(s,'circle',{cx:tx,cy:y(v),r:4,fill:'#fff',stroke:'#0E7C4A','stroke-width':2});}
  });host.appendChild(s)}

function areaChart(host,w,h,vals,opt={}){
  const s=svg(w,h), n=vals.length, lo=opt.lo??Math.min(...vals)-1, hi=opt.hi??Math.max(...vals)+1;
  const x=i=>i/(n-1)*w, y=v=>6+(hi-v)/(hi-lo)*(h-12);
  const g=el(el(s,'defs',{}),'linearGradient',{id:'ga'+opt.id,x1:0,x2:0,y1:0,y2:1});
  el(g,'stop',{offset:'0%','stop-color':'#3E9C6E','stop-opacity':.35});el(g,'stop',{offset:'100%','stop-color':'#3E9C6E','stop-opacity':0});
  // smooth path (Catmull-Rom → Bezier)
  const pts=vals.map((v,i)=>[x(i),y(v)]);let d=`M${pts[0][0]},${pts[0][1]}`;
  for(let i=0;i<n-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    d+=` C${p1[0]+(p2[0]-p0[0])/6},${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6},${p2[1]-(p3[1]-p1[1])/6} ${p2[0]},${p2[1]}`}
  if(opt.target!=null){el(s,'line',{x1:0,x2:w,y1:y(opt.target),y2:y(opt.target),stroke:'#B5832A','stroke-width':1.5,'stroke-dasharray':'5 4'});
    el(s,'text',{x:w-4,y:y(opt.target)-5,'text-anchor':'end','font-size':9.5,'font-weight':600,fill:'#8A6420'},opt.targetLabel)}
  el(s,'path',{d:d+` L${w},${h} L0,${h} Z`,fill:`url(#ga${opt.id})`});
  el(s,'path',{d,fill:'none',stroke:'#0E7C4A','stroke-width':2});
  el(s,'circle',{cx:pts[n-1][0]-3,cy:pts[n-1][1],r:4,fill:'#fff',stroke:'#0E7C4A','stroke-width':2});
  host.appendChild(s)}

function lineChart(host,w,h,cats,series,opt={}){
  const s=svg(w,h), m={l:34,r:opt.r??60,t:14,b:22};
  const all=series.flatMap(z=>z.v.filter(v=>v!=null)).concat(opt.refs?opt.refs.map(r=>r.v):[]);
  const lo=opt.lo??Math.floor(Math.min(...all)-1), hi=opt.hi??Math.ceil(Math.max(...all)+1);
  const x=i=>m.l+i/(cats.length-1)*(w-m.l-m.r), y=v=>m.t+(hi-v)/(hi-lo)*(h-m.t-m.b);
  if(opt.band){el(s,'rect',{x:x(opt.band[0]),y:m.t,width:x(opt.band[1])-x(opt.band[0]),height:h-m.t-m.b,fill:'#F3F4F2'});
    el(s,'text',{x:x(opt.band[0])+6,y:m.t+12,'font-size':9.5,fill:'#5B6660'},opt.bandLabel)}
  axisY(s,m.l,w-m.r,y,opt.ticks,v=>v+'%');
  (opt.refs||[]).forEach(r=>{el(s,'line',{x1:m.l,x2:w-m.r,y1:y(r.v),y2:y(r.v),stroke:'#B5832A','stroke-width':1.5,'stroke-dasharray':'5 4'});
    el(s,'text',{x:w-m.r+4,y:y(r.v)+3,'font-size':9.5,'font-weight':600,fill:'#8A6420'},r.t)});
  const step=opt.every||Math.ceil(cats.length/8);
  const lastTick=Math.floor((cats.length-1)/step)*step;
  cats.forEach((c,i)=>{const show=opt.yearOnly?c.endsWith('Q1'):(i%step===0||(i===cats.length-1&&i-lastTick>=step/2));if(show)el(s,'text',{x:x(i),y:h-6,'text-anchor':'middle','font-size':9.5,fill:'#98A19C'},opt.yearOnly?c.slice(0,4):lbl(c))});
  series.forEach(z=>{let d='',pen=false;z.v.forEach((v,i)=>{if(v==null){pen=false;return}d+=(pen?'L':'M')+x(i)+','+y(v)+' ';pen=true});
    el(s,'path',{d,fill:'none',stroke:z.c,'stroke-width':2,'stroke-linejoin':'round'});
    const li=z.v.map((v,i)=>v==null?-1:i).filter(i=>i>=0).pop();
    el(s,'circle',{cx:x(li),cy:y(z.v[li]),r:4,fill:'#fff',stroke:z.c,'stroke-width':2});
    if(opt.r!==0)el(s,'text',{x:x(li)+8,y:y(z.v[li])+3,'font-size':10,'font-weight':600,fill:'#16201B'},z.v[li].toFixed(1)+'%')});
  host.appendChild(s)}

function groupedBars(host,w,h,cats,a,b){
  const s=svg(w,h), m={l:36,r:8,t:12,b:22}, lo=-28, hi=14;
  const y=v=>m.t+(hi-v)/(hi-lo)*(h-m.t-m.b);
  axisY(s,m.l,w-m.r,y,[-25,-20,-15,-10,-5,0,5,10],v=>v+'%');
  const bw=(w-m.l-m.r)/cats.length, bar=Math.min(18,bw*.3);
  cats.forEach((c,i)=>{const cx=m.l+i*bw+bw/2;
    roundTopBar(s,cx-bar-1,y(0),y(a[i]),bar,6,'#0E7C4A');
    roundTopBar(s,cx+1,y(0),y(b[i]),bar,6,'#B5832A');
    el(s,'text',{x:cx,y:h-6,'text-anchor':'middle','font-size':9.5,fill:'#98A19C'},lbl(c))});
  host.appendChild(s)}

const FITS=[];function fit(id,fn){FITS.push([id,fn])}
const ico=(c='#5B6660')=>`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">`;
const I={grid:ico('#fff')+'<rect x="4" y="4" width="6" height="6" rx="3"/><rect x="14" y="4" width="6" height="6" rx="3"/><rect x="4" y="14" width="6" height="6" rx="3"/><rect x="14" y="14" width="6" height="6" rx="3"/></svg>',
 users:ico()+'<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5"/><path d="M16 4a3 3 0 0 1 0 6M21 20c0-2-1-4-3-5"/></svg>',
 female:ico()+'<circle cx="12" cy="8" r="5"/><path d="M12 13v8M9 18h6"/></svg>',
 chart:ico()+'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
 db:ico()+'<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>',
 gear:ico()+'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>',
 info:ico()+'<circle cx="12" cy="12" r="9"/><path d="M12 8h0M11 12h1v5h1"/></svg>',
 cal:ico('#16201B')+'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>',
 arrow:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#16201B" stroke-width="2"><path d="M7 17L17 7M8 7h9v9"/></svg>',
 search:ico('#16201B')+'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
 bell:ico('#16201B')+'<path d="M6 9a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 21h4"/></svg>',
 dl:ico('#16201B')+'<path d="M12 4v12M6 10l6 6 6-6M4 20h16"/></svg>'};

const TABS=['Overview','Labour Market','Women','Diversification','Data & Method'];
function shell(n,title,sub){
  return `<div class="top"><div class="logo"><i></i>Vision 2030 Analytics</div>
   <div class="nav" data-v="Page navigator (buttons)">${TABS.map((t,i)=>`<span class="${i+1===n?'on':''}">${t}</span>`).join('')}</div>
   <div class="tr"><div class="circ">${I.search}</div><div class="circ">${I.bell}</div><div class="avatar">SM</div></div></div>
   <div class="head"><h1>${title} <span>${sub}</span></h1>
   <div class="r"><div class="chip" data-v="Slicer: DimQuarter range">${I.cal}<span data-d>Q1 2017 – Q3 2026</span></div><div class="chip">${I.dl} Source: GASTAT</div></div></div>
   <div class="side"><div class="grp">${['grid','users','female','chart'].map((k,i)=>`<div class="ic ${i===0?'on':''}">${I[k]}</div>`).join('')}</div>
   <div class="grp">${['db','info'].map(k=>`<div class="ic">${I[k]}</div>`).join('')}</div></div>`}
const A=`<div class="arrow">${I.arrow}</div>`;
</script>

<!-- ============ PAGE 1: OVERVIEW ============ -->
<div class="page" id="p1"></div>
<script>
document.getElementById('p1').innerHTML = shell(1,'Saudi Vision 2030,','Labour & Economy') + `
<div class="grid" style="grid-template-columns:232px 1fr 262px;grid-template-rows:1fr 196px">
  <div style="display:grid;grid-template-rows:1fr 84px;gap:12px">
    <div class="card" data-v="Card: Saudi Unemployment Latest"><div class="ct">Saudi Unemployment</div><div class="cs">Saudi nationals, 15+</div>${A}
      <div class="hero"><div class="k">Latest · <span data-d>Q2 2026</span></div><div class="v" data-d>6.5%</div>
        <div class="f"><span>Target 2030 &nbsp;<b>5.0%</b></span><span data-d>Gap +1.5 pp</span></div></div>
      <div class="cs" style="margin-top:16px">Progress from 12.7% (2017) to 5% target</div>

    <div class="seg" data-d><span>Quarterly</span><span class="on">YoY</span></div>${A}
    <div id="c1" class="plot" data-d style="top:58px"></div></div>
  <div class="card" data-v="Area chart: Saudi unemployment trend"><div class="ct">Unemployment trend</div><div class="cs">Saudis, 2017 – 2026</div>${A}
    <div style="text-align:center;margin-top:14px"><div class="cs">Down since Q1 2017</div><div class="big" data-d>−6.2 <small>pp</small></div></div>
    <div id="c2" data-d style="position:absolute;left:0;right:0;bottom:0;top:120px"></div></div>
  <div class="card" style="grid-column:span 2" data-v="Table: KPI vs Vision 2030 targets">${A}<div class="ct">Vision 2030 scorecard</div><div class="cs">Latest value against original and revised 2030 targets</div>
    <table data-d><tr><th>Indicator</th><th>Latest</th><th>Quarter</th><th>Original target</th><th>Revised target</th><th>Status</th></tr>
     <tr><td>Saudi unemployment</td><td><b>6.5%</b></td><td>Q2 2026</td><td>7.0%</td><td>5.0%</td><td><span class="dot" style="background:#0E7C4A"></span>Original met</td></tr>
     <tr class="alt"><td>Female participation</td><td><b>33.7%</b></td><td>Q2 2026</td><td>30.0%</td><td>40.0%</td><td><span class="dot" style="background:#0E7C4A"></span>Original met</td></tr>
     <tr><td>Non-oil activities growth</td><td><b>+1.9%</b></td><td>Q3 2026</td><td>—</td><td>—</td><td><span class="dot" style="background:#B5832A"></span>Flash estimate</td></tr></table></div>
  <div class="card" data-v="Card: Non-Oil Share of Real GDP"><div class="ct">Non-oil share of real GDP</div><div class="cs">Q3 2025 · chain-linked</div>${A}
    <div style="display:flex;align-items:baseline;gap:8px;margin-top:16px"><div class="big" data-d>55.1<small>%</small></div><span class="tag" data-d>Oil 27.3%</span></div>
    <div data-d><div class="bar"><i style="width:55.1%"></i></div><div class="leg"><span><i style="background:#0E7C4A"></i>Non-oil</span><span><i style="background:#E3F1E8"></i>Oil, government, taxes</span></div></div></div>
</div>`;
fit('c1',(h,w,ht)=>barChart(h,w,ht,gQ,gNon,{ticks:[0,1,2,3,4,5]}));
fit('c2',(h,w,ht)=>areaChart(h,w,ht,urSA,{id:1,lo:4,hi:16,target:5,targetLabel:'Target 5%'}));
</script>

<script>

  ${[['Saudi unemployment','Q2 2026','6.5%','-0.3 pp YoY',''],['Whole Kingdom','incl. expatriates','3.0%','-0.2 pp YoY',''],['Saudi participation','Q1 2026','49.0%','-2.3 pp YoY','bad'],['Gap to 5% target','revised 2030 goal','1.5 pp','was 5.7 pp in 2017','']]
   .map(([t,s,v,d,c])=>`<div class="card" data-v="Card: ${t}"><div class="ct">${t}</div><div class="cs">${s}</div>
   <div style="display:flex;align-items:center;justify-content:space-between;margin-top:12px"><div class="big" style="font-size:26px" data-d>${v}</div><span class="tag ${c}" data-d>${d}</span></div></div>`).join('')}
  <div class="card" style="grid-column:span 3" data-v="Line chart: Saudi unemployment + constant lines 7 / 5">${A}<div class="ct">Saudi unemployment rate, 2017 – 2026</div><div class="cs">Quarterly, % of Saudi labour force · dashed lines = Vision 2030 targets</div>
    <div class="leg" data-d><span><i style="background:#0E7C4A"></i>Saudis</span><span><i style="background:#B5832A;height:0;border-top:2px dashed #B5832A"></i>2030 targets</span></div>
    <div id="c3" class="plot" data-d style="top:76px"></div></div>
  <div class="card" data-v="Text box + slicer: Period">${A}<div class="ct">Reading this chart</div><div class="cs">Methodology notes</div>
    <div class="note" style="margin-top:14px"><b>Series break.</b> GASTAT revised the Labour Force Survey on the 2022 census. Values before 2023 use the older census base, so compare them with care.<br><br><b>COVID shock.</b> Q2 2020 peaked at 15.4%.<br><br><b>Targets moved.</b> The original 7% goal was met in 2024; the goal is now 5%.</div></div>
</div>`;
fit('c3',(h,w,ht)=>lineChart(h,w,ht,urQ,[{v:urSA,c:'#0E7C4A'}],{lo:0,hi:17,ticks:[0,4,8,12,16],refs:[{v:7,t:'Original 7%'},{v:5,t:'Revised 5%'}],band:[0,23],bandLabel:'Pre-2023 series (older census base)',every:4,yearOnly:true,r:72}));
</script>

<!-- ============ PAGE 3: WOMEN ============ -->
<div class="page" id="p3"></div>
<script>
document.getElementById('p3').innerHTML = shell(3,'Women in the workforce,','Saudi nationals') + `
<div class="grid" style="grid-template-columns:1.35fr 1fr 250px;grid-template-rows:1fr 1fr">
  <div class="card" style="grid-row:span 2" data-v="Line chart: Female vs Male LFPR + constant lines 30 / 40">${A}<div class="ct">Labour force participation by sex</div><div class="cs">% of Saudi population 15+ · dashed = Vision 2030 targets for women</div>
    <div class="leg" data-d><span><i style="background:#0E7C4A"></i>Women</span><span><i style="background:#B5832A"></i>Men</span></div>
    <div id="c4" class="plot" data-d style="top:76px"></div></div>
  <div class="card" style="grid-row:span 2" data-v="Line chart: Female UR vs Female EPR">${A}<div class="ct">Fewer unemployed — but not more employed</div><div class="cs">Saudi women, % · gap = Q2 2025 employment ratio not published</div>
    <div class="leg" data-d><span><i style="background:#0E7C4A"></i>Unemployment rate</span><span><i style="background:#B5832A"></i>Employment-to-population</span></div>
    <div id="c5" class="plot" data-d style="top:76px"></div></div>
  <div class="card" data-v="Card: Denominator Effect pp"><div class="ct">Denominator effect</div><div class="cs">Q1 2026</div>${A}
    <div class="hero" style="height:auto;padding:14px 16px 14px"><div class="k">Unemployment at peak participation</div><div class="v" data-d>≈15.6%</div><div class="k" style="margin-top:4px" data-d>vs 9.0% published · +6.6 pp</div></div>
    <div class="note" style="margin-top:12px;font-size:10.5px">Participation peaked at 36.5% (Q3 2022) and was 33.9% in Q1 2026; the employment ratio was 30.8%. Unemployment = (participation − employed) ÷ participation, so women leaving the labour force lowers the rate without new jobs.</div></div>
  <div class="card" data-v="Card + progress: Female LFPR vs 40% target"><div class="ct">Progress to 40% target</div><div class="cs">From 17.7% baseline (2016)</div>
    <div class="big" style="margin-top:12px" data-d>71<small>%</small></div>
    <div data-d><div class="bar"><i style="width:71%"></i></div><div class="leg"><span>33.7% now</span><span style="margin-left:auto">6.3 pp to go</span></div></div></div>
</div>`;
fit('c4',(h,w,ht)=>lineChart(h,w,ht,lfQ,[{v:lfF,c:'#0E7C4A'},{v:lfM,c:'#B5832A'}],{lo:20,hi:72,ticks:[20,30,40,50,60,70],refs:[{v:30,t:'30% orig.'},{v:40,t:'40% rev.'}],every:4,yearOnly:true,r:62}));
const urFa=fuQ.map(q=>{const i=fuQ.indexOf(q);return urF[i]}), eprA=fuQ.map(q=>{const i=eprQ.indexOf(q);return i<0?null:eprF[i]});
fit('c5',(h,w,ht)=>lineChart(h,w,ht,fuQ,[{v:urFa,c:'#0E7C4A'},{v:eprA,c:'#B5832A'}],{lo:5,hi:35,ticks:[5,10,15,20,25,30,35],every:3,r:44}));
</script>

<!-- ============ PAGE 4: DIVERSIFICATION ============ -->
<div class="page" id="p4"></div>
<script>
document.getElementById('p4').innerHTML = shell(4,'Economic diversification,','real GDP') + `
<div class="grid" style="grid-template-columns:1fr 262px;grid-template-rows:112px 1fr">
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">

   <div style="display:flex;align-items:center;justify-content:space-between;margin-top:12px"><div class="big" style="font-size:26px" data-d>${v}</div><span class="tag ${c}" data-d>${d}</span></div></div>`).join('')}</div>

    <div class="ct" style="margin-top:18px">Non-oil share</div><div class="cs">of real GDP, Q3</div>
    <div data-d><div class="leg" style="margin-top:8px"><span>2024 <b>55.4%</b></span><span>2025 <b>55.1%</b></span></div><div class="bar"><i style="width:55.1%"></i></div></div></div>
</div>`;
fit('c6',(h,w,ht)=>groupedBars(h,w,ht,gQ,gNon,gOil));

<!-- ============ PAGE 5: DATA ============ -->
<div class="page" id="p5"></div>
<script>
document.getElementById('p5').innerHTML = shell(5,'Data & method,','how to read this') + `
<div class="grid" style="grid-template-columns:1.6fr 1fr;grid-template-rows:1fr">
  <div class="card" data-v="Table: DimSource (Url as Web URL)">${A}<div class="ct">Sources</div><div class="cs">Every value in the model carries a SourceID</div>
    <table data-d><tr><th>Publisher</th><th>Release</th><th>Type</th></tr>
    ${[['GASTAT','Labour Market Statistics Q1 2025 – Q4 2025','primary'],['GASTAT','Real GDP flash estimates Q3 2026','primary'],['GASTAT','Saudi economy records 4.5% growth in 2025','primary'],['GLMM / GASTAT','LFPR by nationality & sex, Q1 2021 – Q1 2026','secondary'],['Argaam','Unemployment history table 2017 – 2024','secondary'],['EnterpriseAM','Q2 2026 labour force survey','secondary'],['IMF','Saudi Arabia 2025 Article IV','primary'],['Arab News','Unemployment target revised to 5%','secondary']]
      .map((r,i)=>`<tr class="${i%2?'alt':''}"><td>${r[0]}</td><td>${r[1]}</td><td><span class="dot" style="background:${r[2]==='primary'?'#0E7C4A':'#B5832A'}"></span>${r[2]}</td></tr>`).join('')}</table></div>
  <div class="card" data-v="Text box: methodology">${A}<div class="ct">Methodology</div><div class="cs">Read before quoting a number</div>
    <div class="note" style="margin-top:14px"><b>1 · Series break.</b> Labour data before 2023 use the pre-2022-census base.<br><br>
    <b>2 · Flash vs final.</b> GDP flash estimates are labelled and revised later (Q3 2025: 5.0% → 4.8%).<br><br>
    <b>3 · Rebased GDP.</b> Growth uses national accounts rebased to 2023.<br><br>
    <b>4 · Quality checks.</b> SQL checks for duplicates, ranges and unknown sources, plus the identity UR = (LFPR − EPR) / LFPR (8 quarters, within 0.25 pp).<br><br>
    <b>5 · Pipeline.</b> SQL Server views → Power Query → star schema → DAX.</div></div>
</div>`;
</script>

<script>
document.getElementById('p'+PAGE).classList.add('show');
FITS.forEach(([id,fn])=>{const h=document.getElementById(id);if(h.closest('.page.show'))fn(h,h.clientWidth,h.clientHeight)});
// export positions of every visual slot (used to build the layout spec)
window.LAYOUT=[...document.querySelectorAll('#p'+PAGE+' [data-v]')].map(e=>{const r=e.getBoundingClientRect();return{visual:e.dataset.v,x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height)}});
</script>
